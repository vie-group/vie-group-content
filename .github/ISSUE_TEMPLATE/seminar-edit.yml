name: Edit seminar record
description: Edit one published seminar record and optionally replace its files.
title: "[Edit Seminar] seminar-id"
labels: ["seminar-edit"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to edit one seminar record.
        Original Seminar ID identifies the record and stays stable even if Date or Title changes.
        Date, Speaker, and Title are required. Optional URL fields are the full desired final values; leave an optional URL blank to clear it.
        If you drag a file into an Attachment box, that attachment replaces the corresponding URL and is copied into this repository.
  - type: input
    id: original_seminar_id
    attributes:
      label: Original Seminar ID
      description: The current seminar id from the website edit link.
      placeholder: "2024-04-07-zero-shot-adversarial-robustness"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: Use YYYY-MM-DD.
      placeholder: "2024-04-07"
    validations:
      required: true
  - type: input
    id: speaker
    attributes:
      label: Speaker
      placeholder: "Name"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: "Paper or talk title"
    validations:
      required: true
  - type: input
    id: image_url
    attributes:
      label: Image URL
      description: Full desired image URL/path. Leave blank to clear unless using Image Attachment.
      placeholder: "media/image/example.png"
    validations:
      required: false
  - type: textarea
    id: image_attachment
    attributes:
      label: Image Attachment
      description: Drag a replacement cover image here.
      placeholder: "Drop replacement image here."
    validations:
      required: false
  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      description: Full desired paper URL/path. Leave blank to clear unless using Paper Attachment.
      placeholder: "https://arxiv.org/pdf/..."
    validations:
      required: false
  - type: textarea
    id: paper_attachment
    attributes:
      label: Paper Attachment
      description: Drag a replacement paper PDF here.
      placeholder: "Drop replacement paper PDF here."
    validations:
      required: false
  - type: input
    id: slides_url
    attributes:
      label: Slides URL
      description: Full desired slides URL/path. Leave blank to clear unless using Slides Attachment.
      placeholder: "assets/seminars/2024/example/slides.pptx"
    validations:
      required: false
  - type: textarea
    id: slides_attachment
    attributes:
      label: Slides Attachment
      description: Drag replacement slides here.
      placeholder: "Drop replacement slides PDF/PPT here."
    validations:
      required: false
  - type: input
    id: code_url
    attributes:
      label: Code URL
      description: Full desired code URL/path. Leave blank to clear.
      placeholder: "https://github.com/..."
    validations:
      required: false
  - type: input
    id: video_url
    attributes:
      label: Video URL
      description: Full desired video URL/path. Leave blank to clear.
      placeholder: "https://..."
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated full desired tag list. Leave blank to clear.
      placeholder: "IQA, diffusion"
    validations:
      required: false
  - type: textarea
    id: abstract
    attributes:
      label: Abstract
      description: Full desired abstract. Leave blank to clear.
      placeholder: "Optional short summary."
    validations:
      required: false
  - type: textarea
    id: edit_note
    attributes:
      label: Edit Note
      placeholder: "What changed and why?"
    validations:
      required: false
