name: Delete seminar submission
description: Request deletion of a seminar that you submitted.
title: "[Delete Seminar] Original issue #"
labels: ["seminar-delete"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to delete a seminar submitted through a GitHub issue.
        The workflow will only proceed if this delete issue is opened by the same GitHub user who opened the original seminar submission issue.
        For seminars migrated from the website repository, fill Seminar ID so the workflow can find the original source repository.
  - type: input
    id: original_seminar_issue_number
    attributes:
      label: Original Seminar Issue Number
      description: The GitHub issue number used to submit the seminar, for example 1 or #1.
      placeholder: "#1"
    validations:
      required: true
  - type: input
    id: seminar_id
    attributes:
      label: Seminar ID
      description: Optional for new content-repo submissions. Required for older seminars migrated from the website repository.
      placeholder: "2026-09-04-mopd-multi-teacher-on-policy-distillation-for-capability-integration-in-llm-post"
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: Reason
      placeholder: "Wrong file, duplicate submission, wrong date, etc."
    validations:
      required: false
