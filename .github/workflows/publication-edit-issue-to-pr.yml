name: Publication Edit Issue to Pull Request

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: >
      contains(github.event.issue.labels.*.name, 'publication-edit') || startsWith(github.event.issue.title, '[Edit Publication]')
    runs-on: ubuntu-latest
    steps:
      - id: authorize
        name: Verify issue author permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          association="$(gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" --jq '.author_association // ""')"
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ISSUE_AUTHOR}/permission" --jq '.permission // ""' 2>/dev/null || true)"
          echo "Issue author @${ISSUE_AUTHOR}: association=${association:-unknown}, permission=${permission:-none}"

          authorized=false
          case "$association" in
            OWNER|MEMBER|COLLABORATOR) authorized=true ;;
          esac
          case "$permission" in
            admin|maintain|write) authorized=true ;;
          esac
          echo "authorized=${authorized}" >> "$GITHUB_OUTPUT"

          if [ "$authorized" != "true" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --comment "This publication edit request was not processed automatically because @${ISSUE_AUTHOR} is not an owner, member, collaborator, or repository writer. Detected association: ${association:-unknown}; repository permission: ${permission:-none}."
          fi
      - if: steps.authorize.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - if: steps.authorize.outputs.authorized == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.authorize.outputs.authorized == 'true'
        name: Store edit issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node -e 'require("node:fs").writeFileSync("/tmp/publication-edit-issue.md", process.env.ISSUE_BODY || "")'
      - id: publication
        if: steps.authorize.outputs.authorized == 'true'
        name: Convert edit issue to content data
        env:
          ISSUE_BODY_PATH: /tmp/publication-edit-issue.md
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run issue:publication-edit
      - if: steps.authorize.outputs.authorized == 'true'
        run: npm run build:rss
      - if: steps.authorize.outputs.authorized == 'true'
        run: npm run validate
      - name: Create or update PR
        if: steps.authorize.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PUBLICATION_TITLE: ${{ steps.publication.outputs.title }}
          PUBLICATION_ID: ${{ steps.publication.outputs.id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="publication-edit-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          if git diff --quiet -- data/publications.json rss.xml assets/publications && [ -z "$(git ls-files --others --exclude-standard -- assets/publications)" ]; then
            gh issue close "$ISSUE_NUMBER" --comment "No content change was detected for \`${PUBLICATION_ID}\`; this edit may already have been processed."
            exit 0
          fi

          git add data/publications.json rss.xml
          if [ -d assets/publications ] || [ -n "$(git ls-files -- assets/publications)" ]; then
            git add -A assets/publications
          fi
          git commit -m "Edit publication: ${PUBLICATION_TITLE}"
          git push --force origin "$branch"

          pr_url="$(gh pr list --base "$BASE_BRANCH" --head "$branch" --json url --jq '.[0].url')"
          body="Automated publication content edit from ${ISSUE_URL}.

          Updated publication: \`${PUBLICATION_ID}\`.

          Closes #${ISSUE_NUMBER}"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base "$BASE_BRANCH" --head "$branch" --title "Edit publication: ${PUBLICATION_TITLE}" --body "$body")"
          else
            gh pr edit "$pr_url" --title "Edit publication: ${PUBLICATION_TITLE}" --body "$body"
          fi
          gh pr merge "$pr_url" --squash --delete-branch
          gh issue close "$ISSUE_NUMBER" --comment "Created/updated and merged content edit PR: ${pr_url}"
