name: Add News Record

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD"
        required: true
      text:
        description: "News text"
        required: true

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow actor organization membership
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}
          ORG_LOGIN: vie-group
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if gh api "orgs/${ORG_LOGIN}/members/${ACTOR}" --silent; then
            echo "@${ACTOR} is a member of ${ORG_LOGIN}."
          else
            echo "::error::@${ACTOR} is not a member of ${ORG_LOGIN}; refusing to modify content."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update news data
        env:
          NEWS_DATE: ${{ inputs.date }}
          NEWS_TEXT: ${{ inputs.text }}
        run: npm run add:news
      - run: npm run build:rss
      - run: npm run validate
      - name: Commit changes
        env:
          COMMIT_TEXT: ${{ inputs.text }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json rss.xml
          git commit -m "Add news: ${COMMIT_TEXT}" || exit 0
          git push
