name: Build RSS

on:
  push:
    branches: ["main"]
    paths:
      - "data/*.json"
      - "content.config.json"
      - "scripts/generate-rss.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow actor organization membership
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}
          ORG_LOGIN: vie-group
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if gh api "orgs/${ORG_LOGIN}/members/${ACTOR}" --silent; then
            echo "@${ACTOR} is a member of ${ORG_LOGIN}."
          else
            echo "::error::@${ACTOR} is not a member of ${ORG_LOGIN}; refusing to modify content."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:rss
      - run: npm run validate
      - name: Commit RSS
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          git commit -m "Build content RSS" || exit 0
          git push
