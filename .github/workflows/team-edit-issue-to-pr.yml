name: Team Edit Issue to Pull Request

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: >
      contains(github.event.issue.labels.*.name, 'team-edit') || startsWith(github.event.issue.title, '[Edit Team]')
    runs-on: ubuntu-latest
    steps:
      - id: authorize
        name: Verify issue author organization membership
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_MEMBERSHIP_TOKEN: ${{ secrets.ORG_MEMBERSHIP_TOKEN }}
          ORG_NAME: vie-group
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          association="$(gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" --jq '.author_association // ""')"
          membership_token="${ORG_MEMBERSHIP_TOKEN:-$GH_TOKEN}"
          membership_response="$(GH_TOKEN="$membership_token" gh api -i "orgs/${ORG_NAME}/members/${ISSUE_AUTHOR}" --silent 2>/tmp/org-membership.err || true)"
          membership_status="$(printf '%s\n' "$membership_response" | awk '/^HTTP\// { code=$2 } END { print code }')"
          permission="$(gh api "repos/${REPOSITORY}/collaborators/${ISSUE_AUTHOR}/permission" --jq '.permission // ""' 2>/dev/null || true)"
          echo "Issue author @${ISSUE_AUTHOR}: association=${association:-unknown}, org_membership_http=${membership_status:-unknown}, repo_permission=${permission:-unknown}"

          authorized=false
          if [ "${membership_status:-}" = "204" ]; then
            authorized=true
          fi
          case "$association" in
            OWNER|MEMBER) authorized=true ;;
          esac
          case "$permission" in
            admin) authorized=true ;;
          esac
          echo "authorized=${authorized}" >> "$GITHUB_OUTPUT"

          if [ "$authorized" != "true" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --comment "This team edit request was not processed automatically because @${ISSUE_AUTHOR} was not recognized as a vie-group organization member or repository admin. Detected author association: ${association:-unknown}; organization membership HTTP status: ${membership_status:-unknown}; repository permission: ${permission:-unknown}."
          fi
      - if: steps.authorize.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - if: steps.authorize.outputs.authorized == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.authorize.outputs.authorized == 'true'
        name: Store edit issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node -e 'require("node:fs").writeFileSync("/tmp/team-edit-issue.md", process.env.ISSUE_BODY || "")'
      - id: team
        if: steps.authorize.outputs.authorized == 'true'
        name: Convert edit issue to team data
        env:
          ISSUE_BODY_PATH: /tmp/team-edit-issue.md
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run issue:team-edit
      - if: steps.authorize.outputs.authorized == 'true'
        run: npm run validate
      - name: Create or update PR
        if: steps.authorize.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          TEAM_NAME: ${{ steps.team.outputs.name }}
          TEAM_OPERATION: ${{ steps.team.outputs.operation }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="team-edit-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          if git diff --quiet -- data/team.json assets/team && [ -z "$(git ls-files --others --exclude-standard -- assets/team)" ]; then
            gh issue close "$ISSUE_NUMBER" --comment "No team content change was detected for \`${TEAM_NAME}\`; this edit may already have been processed."
            exit 0
          fi

          git add data/team.json
          if [ -d assets/team ] || [ -n "$(git ls-files -- assets/team)" ]; then
            git add -A assets/team
          fi
          git commit -m "Edit team: ${TEAM_NAME}"
          git push --force origin "$branch"

          pr_url="$(gh pr list --base "$BASE_BRANCH" --head "$branch" --json url --jq '.[0].url')"
          body="Automated team content ${TEAM_OPERATION} from ${ISSUE_URL}.

          Team member: \`${TEAM_NAME}\`.

          Closes #${ISSUE_NUMBER}"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base "$BASE_BRANCH" --head "$branch" --title "Edit team: ${TEAM_NAME}" --body "$body")"
          else
            gh pr edit "$pr_url" --title "Edit team: ${TEAM_NAME}" --body "$body"
          fi
          gh pr merge "$pr_url" --squash --delete-branch
          gh issue close "$ISSUE_NUMBER" --comment "Created/updated and merged team edit PR: ${pr_url}"
