name: Validate Content

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: >
      github.event_name != 'pull_request' ||
      (
        startsWith(github.head_ref, 'seminar-edit-') == false &&
        startsWith(github.head_ref, 'seminar-submission-') == false &&
        startsWith(github.head_ref, 'seminar-delete-') == false &&
        startsWith(github.head_ref, 'publication-edit-') == false &&
        startsWith(github.head_ref, 'team-edit-') == false
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:rss
      - run: npm run validate
      - if: github.event_name == 'pull_request'
        run: git diff --exit-code -- rss.xml
